server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
      oauth2:
        resourceserver:
          jwt:
            # The Gateway will call this URL to fetch the Public Key to verify incoming tokens
            jwk-set-uri: http://localhost:8081/api/auth/certs
  cloud:
    gateway:
      discovery:
        locator:
          # Automatically creates routes based on Eureka service IDs (e.g., /USER-SERVICE/**)
          enabled: true
          lower-case-service-id: true
      # Explicit routing definitions
      routes:
        - id: user-service
          # The 'lb://' protocol tells the Gateway to use the LoadBalancer to fetch the IP from Eureka
          uri: lb://user-service
          predicates:
            - Path=/api/users/**, /api/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true