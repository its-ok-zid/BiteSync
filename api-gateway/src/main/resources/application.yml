server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # The Gateway calls this URL to fetch the RSA Public Key to verify incoming tokens
          jwk-set-uri: http://localhost:8081/api/auth/certs
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      discovery:
        locator:
          # Automatically creates routes based on Eureka service IDs (e.g., /USER-SERVICE/**)
          enabled: true
          lower-case-service-id: true
      # Explicit routing definitions
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**, /api/auth/**
        - id: restaurant-service
          uri: lb://restaurant-service
          predicates:
            - Path=/api/restaurants/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true