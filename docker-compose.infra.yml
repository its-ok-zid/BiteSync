version: '3.8'

services:
  # Relational Database for User Profiles and strict ACID Order transactions
  postgres:
    image: postgres:15-alpine
    container_name: bitesync-postgres
    environment:
      POSTGRES_USER: bitesync_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: bitesync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: bitesync-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bitesync.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    restart: unless-stopped

  # NoSQL Document Database for highly nested, read-heavy Restaurant Menus
  mongodb:
    image: mongo:6.0
    container_name: bitesync-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  # In-Memory Cache for L2 Menu Caching
  redis:
    image: redis:7.0-alpine
    container_name: bitesync-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Kafka in KRaft Mode (ZooKeeper-less) for Event-Driven Messaging
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: bitesync-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Confluent KRaft requires a cluster ID to format the storage automatically
      CLUSTER_ID: bitesync-cluster-id-123
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  kafka_data: