version: '3.8'

services:
  # Relational Database for User Profiles and strict ACID Order transactions
  postgres:
    image: postgres:15-alpine
    container_name: bitesync-postgres
    environment:
      POSTGRES_USER: bitesync_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: bitesync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # NoSQL Document Database for highly nested, read-heavy Restaurant Menus
  mongodb:
    image: mongo:6.0
    container_name: bitesync-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  # In-Memory Cache for L2 Menu Caching
  redis:
    image: redis:7.0-alpine
    container_name: bitesync-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Kafka in KRaft Mode (ZooKeeper-less) for Event-Driven Messaging
  kafka:
    image: bitnami/kafka:3.6.1
    container_name: bitesync-kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/bitnami/kafka
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  kafka_data: