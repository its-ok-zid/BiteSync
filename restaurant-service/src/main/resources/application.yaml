server:
  port: 8082

spring:
  application:
    name: restaurant-service
  data:
    mongodb:
      uri: mongodb://admin:password123@localhost:27017/bitesync_menus?authSource=admin
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/api/auth/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1